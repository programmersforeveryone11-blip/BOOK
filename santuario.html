<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK - Santuario del Graffiti</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; background: #0f0f11 url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/huhu.jpg-Q9dk94t2yqheRAyhj0ksdmNx0848jB.png') center / cover fixed no-repeat; color: #fff; padding: 28px; position: relative; }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(15,15,17,.78); z-index: -1; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,.22); padding-bottom: 18px; }
    h1, h2, h3 { letter-spacing: .04em; }
    a { color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: .78rem; letter-spacing: .08em; }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .zone-card { background: rgba(30,30,36,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 2px; padding: 18px; text-align: center; backdrop-filter: blur(6px); position: relative; }
    .zone-card h3 { margin-bottom: 10px; color: #f3f4f6; }
    .zone-card .badge { display: inline-block; padding: 4px 8px; background: #374151; border-radius: 12px; font-size: 0.8rem; margin-bottom: 12px; }
    
    button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 4px; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    button.leave { background: #ef4444; }
    button.delete { background: #dc2626; margin-top: 8px; }

    /* Modal / Canvas de Dibujo */
    #canvasView { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; flex-direction: column; }
    .canvas-tools { background: #18181b; padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    canvas { flex: 1; background: #111; cursor: crosshair; touch-action: none; }
    .mobile-note { margin-top: 8px; font-size: 0.9rem; color: #f97316; }
  </style>
</head>
<body>

  <header>
    <h1>Santuario de Graffiti</h1>
    <a href="index.html">← Volver al Inicio</a>
  </header>

  <section id="lobbyView">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="zoneNameInput" placeholder="Nombre de nueva zona..." style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: white; flex: 1;">
      <button id="createZoneBtn" style="width: auto;">Crear Zona (Máx 20)</button>
    </div>

    <div id="mobileNotice" class="mobile-note" style="display: none;">
      La creación de zonas está deshabilitada en dispositivos móviles. Usa una computadora para crear una zona.
    </div>

    <h2>Zonas Disponibles</h2>
    <div id="zonesGrid" class="grid-container">Cargando zonas...</div>
  </section>

  <!-- Pantalla de Dibujo -->
  <div id="canvasView">
    <div class="canvas-tools">
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="exitZoneBtn" class="leave" style="width: auto;">Salir de la Zona</button>
        <span id="currentZoneTitle">Zona</span>
        <span id="onlineCounter" style="font-size: 0.85rem; color: #10b981; margin-left: 10px;">🟢 Conectados: 1</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <label>Color: <input type="color" id="brushColor" value="#ff0055"></label>
        <label>Grosor: <input type="range" id="brushSize" min="2" max="30" value="5"></label>
      </div>
    </div>
    <canvas id="graffitiCanvas"></canvas>
  </div>

<script>
  const SUPABASE_URL = 'https://vutnvigxtceitadorvob.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_zAPJfsSX5u-6eFqnvwrOfw_IAFUzxbo'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let activeZoneId = null;
  let isDrawing = false;
  let ctx, canvas;
  let activeChannel = null;

  // Detectar si el usuario está desde un teléfono móvil
  function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
      || window.innerWidth <= 768;
  }

  async function init() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if (error || !session) {
      alert("Debes iniciar sesión primero en la aplicación.");
      window.location.href = 'index.html';
      return;
    }
    
    currentUser = session.user;
    setupCanvas();
    loadZones();
    
    // Escuchar cuando se crean o borran zonas en tiempo real
    supabaseClient
      .channel('public_zones')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'graffiti_zones' }, () => {
        loadZones();
      })
      .subscribe();

    // Si es dispositivo móvil, deshabilitar creación UI por UX
    if (isMobileDevice()) {
      document.getElementById('createZoneBtn').disabled = true;
      document.getElementById('zoneNameInput').disabled = true;
      document.getElementById('mobileNotice').style.display = 'block';
    }
  }

  async function loadZones() {
    const { data: zones, error } = await supabaseClient
      .from('graffiti_zones')
      .select('*');
      
    if (error) {
      console.error("Error al cargar zonas:", error.message);
      return;
    }

    const grid = document.getElementById('zonesGrid');
    grid.innerHTML = '';

    if (!zones || zones.length === 0) {
      grid.innerHTML = '<p>No hay zonas creadas aún. ¡Crea la primera!</p>';
      return;
    }

    zones.forEach(zone => {
      const isOwner = zone.created_by === currentUser.id;
      
      const card = document.createElement('div');
      card.className = 'zone-card';
      card.innerHTML = `
        <h3>${zone.name}</h3>
        <button onclick="enterZone('${zone.id}', '${zone.name}')">Entrar a Dibujar</button>
        ${isOwner ? `<button class="delete" onclick="deleteZone('${zone.id}')">Borrar Mi Zona</button>` : ''}
      `;
      grid.appendChild(card);
    });
  }

  // Reemplazo del handler: bloquea creación en móviles y realiza las validaciones
  document.getElementById('createZoneBtn').addEventListener('click', async () => {
    // Bloqueo en dispositivos móviles
    if (isMobileDevice()) {
      alert("La creación de zonas solo está disponible desde una computadora.");
      return;
    }

    const name = document.getElementById('zoneNameInput').value.trim();
    if (!name) return alert("Escribe un nombre para la zona");

    // Validar si el usuario ya creó una zona
    const { data: userZones, error: userZonesError } = await supabaseClient
      .from('graffiti_zones')
      .select('id')
      .eq('created_by', currentUser.id);

    if (userZonesError) {
      console.error('Error comprobando zonas del usuario:', userZonesError);
      alert('Error interno, inténtalo de nuevo.');
      return;
    }

    if (userZones && userZones.length > 0) {
      alert("Ya tienes una zona creada. Debes borrar la tuya si quieres crear una nueva.");
      return;
    }

    // Validar límite total de 20 zonas
    const { data: currentZones, error: zonesError } = await supabaseClient.from('graffiti_zones').select('id');
    if (zonesError) {
      console.error('Error comprobando zonas totales:', zonesError);
      alert('Error interno, inténtalo de nuevo.');
      return;
    }
    if (currentZones && currentZones.length >= 20) {
      alert("Se ha alcanzado el límite máximo de 20 zonas activas.");
      return;
    }

    const { data, error } = await supabaseClient
      .from('graffiti_zones')
      .insert([{ name: name, created_by: currentUser.id }])
      .select()
      .single();

    if (error) {
      alert("Error al crear zona: " + error.message);
    } else {
      document.getElementById('zoneNameInput').value = '';
      enterZone(data.id, data.name);
    }
  });

  async function deleteZone(zoneId) {
    if (!confirm("¿Seguro que quieres borrar tu zona y todos sus trazos?")) return;

    // Borrar trazos
    await supabaseClient.from('graffiti_strokes').delete().eq('zone_id', zoneId);
    // Borrar zona
    const { error } = await supabaseClient.from('graffiti_zones').delete().eq('id', zoneId);

    if (error) {
      alert("Error al borrar zona: " + error.message);
    } else {
      loadZones();
    }
  }

  function enterZone(zoneId, zoneName) {
    activeZoneId = zoneId;
    document.getElementById('currentZoneTitle').textContent = `Zona: ${zoneName}`;
    document.getElementById('canvasView').style.display = 'flex';
    resizeCanvas();
    loadStrokes();

    // CANAL EN TIEMPO REAL: Presencia y Trazos de Dibujo
    activeChannel = supabaseClient.channel(`room_${zoneId}`, {
      config: { presence: { key: currentUser.id } }
    });

    // 1. Contar personas dentro en tiempo real (al entrar o salir)
    activeChannel.on('presence', { event: 'sync' }, () => {
      const state = activeChannel.presenceState();
      const count = Object.keys(state).length;
      document.getElementById('onlineCounter').textContent = `🟢 Conectados: ${count}`;
    });

    // 2. Recibir dibujos en tiempo real de otros usuarios
    activeChannel.on('broadcast', { event: 'stroke' }, payload => {
      renderStroke(payload.payload.stroke_data);
    });

    activeChannel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await activeChannel.track({ user_id: currentUser.id, online_at: new Date() });
      }
    });
  }

  document.getElementById('exitZoneBtn').addEventListener('click', async () => {
    if (activeChannel) {
      await activeChannel.untrack();
      await supabaseClient.removeChannel(activeChannel);
      activeChannel = null;
    }
    document.getElementById('canvasView').style.display = 'none';
    activeZoneId = null;
    loadZones();
  });

  // --- LÓGICA DE DIBUJO ---
  function setupCanvas() {
    canvas = document.getElementById('graffitiCanvas');
    ctx = canvas.getContext('2d');

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    window.addEventListener('resize', resizeCanvas);
  }

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight - 50;
  }

  let currentStroke = [];

  function startDrawing(e) {
    isDrawing = true;
    currentStroke = [];
    addPoint(e);
  }

  function draw(e) {
    if (!isDrawing) return;
    addPoint(e);
    renderStroke(currentStroke);
  }

  function addPoint(e) {
    const rect = canvas.getBoundingClientRect();
    currentStroke.push({
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
      color: document.getElementById('brushColor').value,
      size: document.getElementById('brushSize').value
    });
  }

  async function stopDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 0 && activeZoneId) {
      // Transmitir en tiempo real a los demás conectados
      if (activeChannel) {
        activeChannel.send({
          type: 'broadcast',
          event: 'stroke',
          payload: { stroke_data: currentStroke }
        });
      }

      // Guardar en la base de datos para la memoria permanente
      await supabaseClient.from('graffiti_strokes').insert([{
        zone_id: activeZoneId,
        user_id: currentUser.id,
        stroke_data: currentStroke
      }]);
    }
  }

  function renderStroke(points) {
    if (!points || points.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = points[0].color;
    ctx.lineWidth = points[0].size;
    ctx.lineCap = 'round';
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();
  }

  async function loadStrokes() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const { data: strokes } = await supabaseClient.from('graffiti_strokes').select('stroke_data').eq('zone_id', activeZoneId);
    if (strokes) {
      strokes.forEach(s => renderStroke(s.stroke_data));
    }
  }

  window.onload = init;
</script>
</body>
</html>

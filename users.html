<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK - Santuario del Graffiti</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; background: #0f0f11 url('https://hebbkx1anhila5yf.public.blob.vercel-storage.com/huhu.jpg-Q9dk94t2yqheRAyhj0ksdmNx0848jB.png') center / cover fixed no-repeat; color: #fff; padding: 28px; position: relative; }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(15,15,17,.78); z-index: -1; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,.22); padding-bottom: 18px; }
    h1, h2, h3 { letter-spacing: .04em; }
    a { color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: .78rem; letter-spacing: .08em; }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .zone-card { background: rgba(30,30,36,.9); border: 1px solid rgba(255,255,255,.22); border-radius: 2px; padding: 18px; text-align: center; backdrop-filter: blur(6px); position: relative; }
    .zone-card h3 { margin-bottom: 10px; color: #f3f4f6; }
    .zone-card .badge { display: inline-block; padding: 4px 8px; background: #374151; border-radius: 12px; font-size: 0.8rem; margin-bottom: 12px; }
    
    button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 4px; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    button.leave { background: #ef4444; }
    button.delete { background: #dc2626; margin-top: 8px; }

    /* Modal / Canvas de Dibujo */
    #canvasView { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; flex-direction: column; }
    .canvas-tools { background: #18181b; padding: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .tool-group { display: flex; gap: 8px; align-items: center; background: #27272a; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; }
    .tool-btn { background: #3f3f46; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; margin: 0; }
    .tool-btn.active { background: #3b82f6; }

    .workspace { display: flex; flex-direction: row; width: 100%; height: calc(100vh - 65px); overflow: hidden; position: relative; }
    canvas { flex: 1; width: 100%; background: #111; cursor: crosshair; touch-action: none; }

    /* Panel Lateral Derecho para Usuarios e Historial */
    .sidebar { width: 260px; min-width: 260px; background: #18181b; border-left: 1px solid #27272a; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; font-size: 0.85rem; z-index: 10; }
    .sidebar-section { background: #27272a; border-radius: 6px; padding: 10px; }
    .sidebar-section h4 { margin-bottom: 8px; font-size: 0.9rem; color: #60a5fa; border-bottom: 1px solid #3f3f46; padding-bottom: 4px; }
    .user-list, .history-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .user-item { display: flex; align-items: center; gap: 6px; color: #e4e4e7; word-break: break-all; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .history-item { color: #a1a1aa; font-size: 0.78rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <header>
    <h1>Santuario de Graffiti</h1>
    <a href="index.html">← Volver al Inicio</a>
  </header>

  <section id="lobbyView">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="zoneNameInput" placeholder="Nombre de nueva zona..." style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: white; flex: 1;">
      <button id="createZoneBtn" style="width: auto;">Crear Zona (Máx 20)</button>
    </div>

    <h2>Zonas Disponibles</h2>
    <div id="zonesGrid" class="grid-container">Cargando zonas...</div>
  </section>

  <!-- Pantalla de Dibujo -->
  <div id="canvasView">
    <div class="canvas-tools">
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="exitZoneBtn" class="leave" style="width: auto;">Salir</button>
        <span id="currentZoneTitle" style="font-weight: bold; color: #60a5fa;">Zona</span>
      </div>

      <!-- Barra de Herramientas Avanzadas -->
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <div class="tool-group">
          <button id="brushMode" class="tool-btn active" onclick="setTool('brush')">Pincel</button>
          <button id="sprayMode" class="tool-btn" onclick="setTool('spray')">Spray</button>
          <button id="shapeMode" class="tool-btn" onclick="setTool('shape')">Cuadrado</button>
          <button id="eraserMode" class="tool-btn" onclick="setTool('eraser')">Borrador</button>
        </div>

        <div class="tool-group">
          <button class="tool-btn" onclick="undoLastStroke()" title="Deshacer último trazo propio">↩ Deshacer</button>
          <button id="ruleToggleBtn" class="tool-btn" onclick="toggleRuler()">📏 Regla: OFF</button>
        </div>

        <div class="tool-group">
          <label>Color: <input type="color" id="brushColor" value="#ff0055"></label>
          <label>Grosor: <input type="range" id="brushSize" min="2" max="60" value="8"></label>
          <label>Opacidad: <input type="range" id="brushOpacity" min="0.1" max="1" step="0.1" value="1"></label>
        </div>
      </div>
    </div>

    <div class="workspace">
      <canvas id="graffitiCanvas"></canvas>
      
      <!-- Panel Lateral Derecho -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <h4>🟢 Conectados (<span id="connectedCount">0</span>)</h4>
          <ul id="connectedUsersList" class="user-list"></ul>
        </div>

        <div id="historySection" class="sidebar-section" style="display: none;">
          <h4>📜 Historial de Visitas</h4>
          <ul id="historyList" class="history-list"></ul>
        </div>
      </aside>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://vutnvigxtceitadorvob.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_zAPJfsSX5u-6eFqnvwrOfw_IAFUzxbo'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let activeZoneId = null;
  let currentZoneCreatorId = null;
  let isDrawing = false;
  let ctx, canvas;
  let activeChannel = null;

  // Estados de Herramientas
  let currentTool = 'brush'; // brush, spray, shape, eraser
  let useRuler = false;
  let myStrokesIDs = []; // Para llevar control de los trazos propios y hacer Undo

  function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
      || window.innerWidth <= 768;
  }

  async function init() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    
    if (error || !session) {
      alert("Debes iniciar sesión primero en la aplicación.");
      window.location.href = 'index.html';
      return;
    }
    
    currentUser = session.user;
    setupCanvas();
    loadZones();
    
    supabaseClient
      .channel('public_zones')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'graffiti_zones' }, () => {
        loadZones();
      })
      .subscribe();

    if (isMobileDevice()) {
      document.getElementById('createZoneBtn').disabled = true;
      document.getElementById('zoneNameInput').disabled = true;
    }
  }

  function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(btn => {
      if(['brushMode','sprayMode','shapeMode','eraserMode'].includes(btn.id)) {
        btn.classList.remove('active');
      }
    });
    if(tool === 'brush') document.getElementById('brushMode').classList.add('active');
    if(tool === 'spray') document.getElementById('sprayMode').classList.add('active');
    if(tool === 'shape') document.getElementById('shapeMode').classList.add('active');
    if(tool === 'eraser') document.getElementById('eraserMode').classList.add('active');
  }

  function toggleRuler() {
    useRuler = !useRuler;
    const btn = document.getElementById('ruleToggleBtn');
    if(useRuler) {
      btn.classList.add('active');
      btn.textContent = '📏 Regla: ON';
    } else {
      btn.classList.remove('active');
      btn.textContent = '📏 Regla: OFF';
    }
  }

  async function loadZones() {
    const { data: zones, error } = await supabaseClient.from('graffiti_zones').select('*');
    if (error) return;

    const grid = document.getElementById('zonesGrid');
    grid.innerHTML = '';

    if (!zones || zones.length === 0) {
      grid.innerHTML = '<p>No hay zonas creadas aún. ¡Crea la primera!</p>';
      return;
    }

    for (const zone of zones) {
      const isOwner = zone.created_by === currentUser.id;
      const tempChannel = supabaseClient.channel(`room_${zone.id}`);
      try {
        await tempChannel.subscribe();
        const presenceState = tempChannel.presenceState ? tempChannel.presenceState() : {};
        const activeCount = Object.keys(presenceState).length || 0;
        await supabaseClient.removeChannel(tempChannel);
        
        const isFull = activeCount >= 10;
        const card = document.createElement('div');
        card.className = 'zone-card';
        card.innerHTML = `
          <h3>${zone.name}</h3>
          <div class="badge">${activeCount} / 10 Personas</div>
          <button onclick="enterZone('${zone.id}', '${zone.name}', '${zone.created_by}')" ${isFull ? 'disabled' : ''}>
            ${isFull ? 'Zona Llena' : 'Entrar a Dibujar'}
          </button>
          ${isOwner ? `<button class="delete" onclick="deleteZone('${zone.id}')">Borrar Mi Zona</button>` : ''}
        `;
        grid.appendChild(card);
      } catch (err) {
        console.warn(err);
      }
    }
  }

  document.getElementById('createZoneBtn').addEventListener('click', async () => {
    if (isMobileDevice()) {
      alert("La creación de zonas solo está disponible desde una computadora.");
      return;
    }
    const name = document.getElementById('zoneNameInput').value.trim();
    if (!name) return alert("Escribe un nombre para la zona");

    const { data: userZones } = await supabaseClient.from('graffiti_zones').select('id').eq('created_by', currentUser.id);
    if (userZones && userZones.length > 0) {
      alert("Ya tienes una zona creada. Debes borrar la tuya si quieres crear una nueva.");
      return;
    }

    const { data, error } = await supabaseClient.from('graffiti_zones').insert([{ name: name, created_by: currentUser.id }]).select().single();
    if (!error) {
      document.getElementById('zoneNameInput').value = '';
      enterZone(data.id, data.name, data.created_by);
    }
  });

  async function deleteZone(zoneId) {
    if (!confirm("¿Seguro que quieres borrar tu zona y todos sus trazos?")) return;
    await supabaseClient.from('graffiti_strokes').delete().eq('zone_id', zoneId);
    await supabaseClient.from('graffiti_zone_access_logs').delete().eq('zone_id', zoneId);
    await supabaseClient.from('graffiti_zones').delete().eq('id', zoneId);
    loadZones();
  }

  async function enterZone(zoneId, zoneName, creatorId) {
    activeZoneId = zoneId;
    currentZoneCreatorId = creatorId;
    myStrokesIDs = [];

    document.getElementById('currentZoneTitle').textContent = `Zona: ${zoneName}`;
    document.getElementById('canvasView').style.display = 'flex';
    resizeCanvas();
    loadStrokes();

    await logUserAccess(zoneId);

    const isOwner = currentZoneCreatorId === currentUser.id;
    const historySection = document.getElementById('historySection');
    if (isOwner) {
      historySection.style.display = 'block';
      loadAccessHistory(zoneId);
    } else {
      historySection.style.display = 'none';
    }

    activeChannel = supabaseClient.channel(`room_${zoneId}`, {
      config: { presence: { key: currentUser.id } }
    });

    activeChannel.on('presence', { event: 'sync' }, () => {
      updateConnectedUsersList(activeChannel.presenceState());
    });

    activeChannel.on('broadcast', { event: 'stroke' }, payload => {
      renderStrokeObject(payload.payload.stroke_data);
    });

    activeChannel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        const userEmail = currentUser.email ? currentUser.email.split('@')[0] : 'Usuario';
        await activeChannel.track({ user_id: currentUser.id, email: userEmail, online_at: new Date() });
      }
    });
  }

  function updateConnectedUsersList(state) {
    const list = document.getElementById('connectedUsersList');
    list.innerHTML = '';
    const keys = Object.keys(state);
    document.getElementById('connectedCount').textContent = keys.length;
    keys.forEach(key => {
      const presenceInfo = state[key][0];
      const li = document.createElement('li');
      li.className = 'user-item';
      li.innerHTML = `<span class="status-dot"></span> ${presenceInfo.email || 'Anónimo'}`;
      list.appendChild(li);
    });
  }

  async function logUserAccess(zoneId) {
    const userEmail = currentUser.email ? currentUser.email.split('@')[0] : 'Anónimo';
    await supabaseClient.from('graffiti_zone_access_logs').insert([{
      zone_id: zoneId,
      user_id: currentUser.id,
      user_email: userEmail
    }]);
  }

  async function loadAccessHistory(zoneId) {
    const { data: logs } = await supabaseClient.from('graffiti_zone_access_logs').select('*').eq('zone_id', zoneId).order('accessed_at', { ascending: false }).limit(10);
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';
    if (!logs || logs.length === 0) {
      historyList.innerHTML = '<li style="color:#71717a">Sin visitas</li>';
      return;
    }
    logs.forEach(log => {
      const date = new Date(log.accessed_at);
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `<span>👤 ${log.user_email}</span> <span>${timeStr}</span>`;
      historyList.appendChild(li);
    });
  }

  document.getElementById('exitZoneBtn').addEventListener('click', async () => {
    if (activeChannel) {
      await activeChannel.untrack();
      await supabaseClient.removeChannel(activeChannel);
      activeChannel = null;
    }
    document.getElementById('canvasView').style.display = 'none';
    activeZoneId = null;
    loadZones();
  });

  function setupCanvas() {
    canvas = document.getElementById('graffitiCanvas');
    ctx = canvas.getContext('2d');

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', resizeCanvas);
  }

  function resizeCanvas() {
    if (canvas && canvas.parentElement) {
      canvas.width = canvas.parentElement.clientWidth - 260;
      canvas.height = canvas.parentElement.clientHeight;
    }
  }

  let currentStrokePoints = [];
  let lastX = 0, lastY = 0;

  function startDrawing(e) {
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    currentStrokePoints = [{ x: lastX, y: lastY }];
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // Aplicar Regla (Guía de Línea Recta respecto al punto inicial)
    if (useRuler && currentStrokePoints.length > 0) {
      let startPoint = currentStrokePoints[0];
      // Forzar movimiento puramente horizontal o vertical según cercanía
      if (Math.abs(x - startPoint.x) > Math.abs(y - startPoint.y)) {
        y = startPoint.y;
      } else {
        x = startPoint.x;
      }
    }

    currentStrokePoints.push({ x, y });

    const color = document.getElementById('brushColor').value;
    const size = parseInt(document.getElementById('brushSize').value);
    const opacity = parseFloat(document.getElementById('brushOpacity').value);

    let strokeData = {
      tool: currentTool,
      color: color,
      size: size,
      opacity: opacity,
      points: currentStrokePoints
    };

    renderStrokeObject(strokeData);
    lastX = x;
    lastY = y;
  }

  async function stopDrawing() {
    if (!isDrawing) return;
    isDrawing = false;

    if (currentStrokePoints.length > 0 && activeZoneId) {
      const color = document.getElementById('brushColor').value;
      const size = parseInt(document.getElementById('brushSize').value);
      const opacity = parseFloat(document.getElementById('brushOpacity').value);

      const finalStroke = {
        tool: currentTool,
        color: color,
        size: size,
        opacity: opacity,
        points: currentStrokePoints
      };

      if (activeChannel) {
        activeChannel.send({
          type: 'broadcast',
          event: 'stroke',
          payload: { stroke_data: finalStroke }
        });
      }

      const { data } = await supabaseClient.from('graffiti_strokes').insert([{
        zone_id: activeZoneId,
        user_id: currentUser.id,
        stroke_data: finalStroke
      }]).select().single();

      if (data) {
        myStrokesIDs.push(data.id);
      }
    }
    currentStrokePoints = [];
  }

  function renderStrokeObject(s) {
    if (!s || !s.points || s.points.length === 0) return;
    ctx.save();
    ctx.globalAlpha = s.opacity || 1.0;

    if (s.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.lineWidth = s.size * 1.5;
      ctx.lineCap = 'round';
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.stroke();
    } else if (s.tool === 'spray') {
      ctx.fillStyle = s.color;
      const density = s.size * 2;
      s.points.forEach(pt => {
        for (let i = 0; i < density; i++) {
          let offsetX = (Math.random() - 0.5) * s.size * 2;
          let offsetY = (Math.random() - 0.5) * s.size * 2;
          ctx.fillRect(pt.x + offsetX, pt.y + offsetY, 1.5, 1.5);
        }
      });
    } else if (s.tool === 'shape') {
      ctx.fillStyle = s.color;
      s.points.forEach(pt => {
        ctx.fillRect(pt.x - s.size/2, pt.y - s.size/2, s.size, s.size);
      });
    } else {
      // Pincel Normal
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  async function loadStrokes() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const { data: strokes } = await supabaseClient.from('graffiti_strokes').select('*').eq('zone_id', activeZoneId);
    if (strokes) {
      strokes.forEach(s => {
        renderStrokeObject(s.stroke_data);
        if (s.user_id === currentUser.id) {
          myStrokesIDs.push(s.id);
        }
      });
    }
  }

  async function undoLastStroke() {
    if (myStrokesIDs.length === 0) {
      alert("No tienes trazos recientes para deshacer.");
      return;
    }
    const lastId = myStrokesIDs.pop();
    await supabaseClient.from('graffiti_strokes').delete().eq('id', lastId);
    loadStrokes(); // Recarga el canvas completo limpio con los trazos restantes de todos
  }

  window.onload = init;
</script>
</body>
</html>

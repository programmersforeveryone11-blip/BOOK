<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil — BOOK Luizabeth's Studios</title>
  <link rel="icon" type="image/png" href="films1.png" />
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
            archivo: ['Archivo Black', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    .bg-grid-pattern {
      background-color: #f7f7f8;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-grid-pattern text-black font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- TOP BAR -->
  <header class="w-full bg-white/90 backdrop-blur-md border-b border-black/10 px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="font-archivo text-xl tracking-tighter uppercase inline-block">← VOLVER A BOOK</a>
    <div id="userHeaderEmail" class="text-xs font-mono text-neutral-500"></div>
  </header>

  <!-- MAIN -->
  <main class="max-w-4xl mx-auto w-full px-4 py-12 flex-grow">
    <div class="bg-white border border-black rounded-2xl shadow-xl overflow-hidden p-6 md:p-10">
      
      <div class="flex flex-col md:flex-row items-center gap-6 pb-8 border-b border-black/10">
        <div id="profileAvatarContainer" class="w-24 h-24 rounded-full bg-black text-white flex items-center justify-center font-archivo text-3xl overflow-hidden border-2 border-black">
          <span id="profileInitial">U</span>
        </div>
        <div class="text-center md:text-left">
          <span class="text-xs font-mono uppercase tracking-widest text-neutral-400">Panel de Usuario</span>
          <h1 id="profileNameTitle" class="font-archivo text-3xl md:text-4xl uppercase tracking-tight mt-1">Cargando...</h1>
          <p id="profileEmailSubtitle" class="text-xs font-mono text-neutral-600 mt-1"></p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
        <div class="p-5 bg-neutral-50 rounded-xl border border-black/10">
          <span class="text-[10px] font-mono tracking-widest uppercase text-neutral-500 block mb-1">Nombre Completo</span>
          <p id="infoName" class="font-mono font-bold text-base">-</p>
        </div>

        <div class="p-5 bg-neutral-50 rounded-xl border border-black/10">
          <span class="text-[10px] tracking-widest uppercase font-mono text-neutral-500 block mb-1">Edad</span>
          <p id="infoAge" class="font-mono font-bold text-base">-</p>
        </div>

        <div class="p-5 bg-neutral-50 rounded-xl border border-black/10">
          <span class="text-[10px] tracking-widest uppercase font-mono text-neutral-500 block mb-1">Categoría / Gusto Favorito</span>
          <p id="infoTaste" class="font-mono font-bold text-base uppercase">-</p>
        </div>

        <div class="p-5 bg-neutral-50 rounded-xl border border-black/10">
          <span class="text-[10px] tracking-widest uppercase font-mono text-neutral-500 block mb-1">ID de Usuario (Supabase)</span>
          <p id="infoId" class="font-mono text-xs text-neutral-600 break-all">-</p>
        </div>
      </div>

      <div class="mt-10 pt-6 border-t border-black/10 flex flex-wrap gap-4 justify-between items-center">
        <a href="index.html" class="px-5 py-2.5 bg-black text-white font-mono text-xs uppercase tracking-widest rounded-lg hover:bg-neutral-800 transition-colors">Ir al Inicio</a>

        <!-- logoutBtn tiene id para control desde JS -->
        <button id="logoutBtn" onclick="logoutSession()" class="px-5 py-2.5 bg-red-100 text-red-700 font-mono text-xs uppercase tracking-widest rounded-lg hover:bg-red-200 transition-colors">
          Cerrar Sesión
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-6 text-xs font-mono text-neutral-500 border-t border-black/10">
    LUIZABETH'S.STUDIOS © 2026 — Todos los derechos reservados
  </footer>

  <!-- SCRIPTS -->
  <script>
    const SUPABASE_URL = 'https://vutnvigxtceitadorvob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zAPJfsSX5u-6eFqnvwrOfw_IAFUzxbo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOCAL_SESSION_KEY = 'book_user_session';

    // Mostrar estado cuando no hay sesión (evita redirecciones)
    function showNoSessionState() {
      document.getElementById('profileNameTitle').innerText = 'CARGANDO...';
      document.getElementById('profileEmailSubtitle').innerText = '';
      document.getElementById('userHeaderEmail').innerText = '';
      document.getElementById('infoName').innerText = '-';
      document.getElementById('infoAge').innerText = '-';
      document.getElementById('infoTaste').innerText = '-';
      document.getElementById('infoId').innerText = '-';
      document.getElementById('profileInitial').innerText = 'U';

      // Ocultar Cerrar Sesión si no hay sesión
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.style.display = 'none';

      // Botón visible para ir a index y abrir el modal de auth (index.html?openAuth=1)
      if (!document.getElementById('openAuthFromProfile')) {
        const authBtn = document.createElement('a');
        authBtn.id = 'openAuthFromProfile';
        authBtn.className = 'px-5 py-2.5 bg-black text-white font-mono text-xs uppercase tracking-widest rounded-lg hover:bg-neutral-800 transition-colors inline-block';
        authBtn.href = 'index.html?openAuth=1';
        authBtn.innerText = 'Iniciar sesión / Registrarse';
        const container = document.querySelector('.mt-10.pt-6');
        if (container) container.insertBefore(authBtn, container.firstChild);
      }
    }

    // Cargar perfil: lee localStorage primero (útil en file://), luego intenta Supabase con timeout
    async function loadUserProfile() {
      let sessionData = null;

      // 0 - intento localStorage inmediatamente (dev fallback)
      try {
        const stored = localStorage.getItem(LOCAL_SESSION_KEY);
        if (stored) sessionData = JSON.parse(stored);
      } catch (e) { /* ignore */ }

      // 1 - si no hay, intentar Supabase con timeout
      if (!sessionData) {
        try {
          const sessionPromise = supabaseClient.auth.getSession();
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 3000));
          const res = await Promise.race([sessionPromise, timeoutPromise]);
          // SDK puede devolver { data: { session } } o { session }
          const data = res && res.data ? res.data : res;
          if (data && data.session && data.session.user) {
            const user = data.session.user;
            const meta = user.user_metadata || {};
            sessionData = {
              id: user.id,
              email: user.email,
              nombre: meta.nombre || user.email.split('@')[0],
              apellido: meta.apellido || '',
              edad: meta.edad || 'No especificada',
              gustos: meta.gustos || '-',
              foto_perfil: meta.foto_perfil || null
            };
          }
        } catch (e) {
          console.warn('Supabase getSession falló o timeout:', e);
        }

        // 2 - backup: volver a localStorage por si acaso
        if (!sessionData) {
          try {
            const stored = localStorage.getItem(LOCAL_SESSION_KEY);
            if (stored) sessionData = JSON.parse(stored);
          } catch (e) {}
        }
      }

      // 3 - si aún no hay sessionData: mostrar UI en modo sin sesión (NO redirigir)
      if (!sessionData) {
        showNoSessionState();
        return;
      }

      // 4 - pintar datos
      document.getElementById('profileNameTitle').innerText = (sessionData.nombre || 'Usuario') + ' ' + (sessionData.apellido || '');
      document.getElementById('profileEmailSubtitle').innerText = sessionData.email || '';
      document.getElementById('userHeaderEmail').innerText = sessionData.email || '';
      document.getElementById('infoName').innerText = (sessionData.nombre || '-') + ' ' + (sessionData.apellido || '');
      document.getElementById('infoAge').innerText = sessionData.edad || 'No especificada';
      document.getElementById('infoTaste').innerText = sessionData.gustos || '-';
      document.getElementById('infoId').innerText = sessionData.id || '-';

      const avatarContainer = document.getElementById('profileAvatarContainer');
      if (sessionData.foto_perfil) {
        avatarContainer.innerHTML = '<img src="' + sessionData.foto_perfil + '" class="w-full h-full object-cover" alt="Avatar"/>';
      } else if (sessionData.nombre) {
        document.getElementById('profileInitial').innerText = sessionData.nombre.charAt(0).toUpperCase();
      }

      // mostrar logout si hay sesión
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.style.display = '';
    }

    // Cerrar sesión: limpia supabase + localStorage, si estamos en file:// no redirigimos
    async function logoutSession() {
      try { await supabaseClient.auth.signOut(); } catch (e) {}
      localStorage.removeItem(LOCAL_SESSION_KEY);

      if (location.protocol === 'file:') {
        showNoSessionState();
        return;
      }
      window.location.href = 'index.html';
    }

    // Ejecutar al cargar
    document.addEventListener('DOMContentLoaded', loadUserProfile);

    // Escuchar cambios de auth para actualizar localStorage/UI si corresponde
    supabaseClient.auth.onAuthStateChange((event, session) => {
      try {
        if (session && session.user) {
          const user = session.user;
          const uMeta = user.user_metadata || {};
          const profile = {
            id: user.id,
            email: user.email,
            nombre: uMeta.nombre || user.email.split('@')[0],
            apellido: uMeta.apellido || '',
            edad: uMeta.edad || null,
            gustos: uMeta.gustos || 'movie',
            foto_perfil: uMeta.foto_perfil || ''
          };
          localStorage.setItem(LOCAL_SESSION_KEY, JSON.stringify(profile));
          loadUserProfile();
        }
      } catch (e) { console.warn('onAuthStateChange handler error', e); }
    });

  </script>
</body>
</html>
